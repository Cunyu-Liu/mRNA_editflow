  - decision_id: V3-DEC-020
    decision_type: AMENDMENT
    dimension: gse200304_model_input_route_and_route_conditional_exposure
    conflict: >-
      DEC019 preserved a nonwaivable checkpoint-specific exposure gate for
      GSE200304, while the owner-selected prospective route uses random
      initialization and forbids every foundation checkpoint and other external
      learned input. The existing empty checkpoint set remains a valid FAIL for
      FOUNDATION_CHECKPOINT and cannot be relabelled PASS or waived.
    resolution: >-
      Freeze SCRATCH_ONLY_NO_FOUNDATION_NO_EXTERNAL_LEARNED_INPUTS as the
      GSE200304 route selected before model results. On that route,
      checkpoint-specific exposure is NOT_APPLICABLE_BY_FROZEN_NO_EXTERNAL_LEARNED_INPUT_ROUTE,
      not PASS: zero external checkpoints and zero external learned inputs are
      allowed, initialization is random only, and a runtime no-external-learned-
      input attestation is required before any learned-parameter run. Retain
      FOUNDATION_CHECKPOINT as an allowed alternative with the DEC019 activation
      and adjudicator unchanged, minimum audited checkpoint count one, empty-set
      pass forbidden, and all four required exposure facts true. No post-result
      route switch, fallback, or duplicate study credit is allowed. The 3/2/1
      minima, GSE200304 maximum 1/1/0 contribution, endpoint, unit, power, CI,
      rights, split, leakage, and every other nonroute gate remain unchanged.
      The existing license and redistribution rights gate remains PASS and is
      not reopened by DEC020. Route-scoped qualification and canonical count may
      become possible only after every applicable gate passes, but this decision
      does not authorize canonical materialization execution or private payload
      access.
      Aggregate public structural authority informed protocol design, so the
      dataset is disclosed as not untouched and no no-prior-influence claim is
      allowed; the route is frozen prospectively from DEC020 forward. A complete
      prior-analytic-use attestation remains required before predictor protocol
      promotion or training and is not completed by this amendment. This
      decision changes no current qualified count, is not training evidence,
      authorizes no training, GPU work, model selection, next phase, or sealed
      contact, and establishes no scientific claim.
