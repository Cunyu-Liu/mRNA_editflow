  - decision_id: V3-DEC-016
    decision_type: AMENDMENT
    dimension: sealed_a0_phase_boundary
    conflict: >-
      The pre-authorization snapshot design in V3-DEC-015 was implemented too
      early: the current sealed evaluator is still a deterministic aborting stub,
      whereas the authority contract assigns no-stub execution freeze and
      independent readiness review to A9.
    resolution: >-
      Supersede every latent success path in the A0 sealed guard with an
      unconditional A0-A9 hard disable. No configuration toggle, authorization
      record, readiness record, execution manifest, or synthetic positive fixture
      can authorize the A0 runner. A9 must replace this guard only after the
      evaluator has no stub, all ordinary gates pass, consumed assets and the full
      runtime source/environment closure are frozen, aggregate output publication
      is transactionally ordered before terminal completion, and an independent
      readiness review passes. A10 still requires separate explicit user
      authorization for the unique formal call.
