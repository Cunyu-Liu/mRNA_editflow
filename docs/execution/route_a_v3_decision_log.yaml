  - decision_id: V3-DEC-019
    decision_type: AMENDMENT
    dimension: a1_measurement_uncertainty_split_and_claim_boundary
    conflict: >-
      The active authority left the owner uncertainty policy unresolved for the
      single-GSM GSE114002 designed library, treated GSE200304 raw replay as a
      prerequisite even though an author-published processed endpoint exists,
      placed all split freezing in A2, and recorded the 0.30 full-CI-width
      threshold only as a discussion-open companion choice.
    resolution: >-
      Apply the user-authorized DEC-019 package without changing the root
      contract bytes or the frozen 3/2/1 gate. GSE114002 may contribute at most
      one true-A2 dense study only after every nonwaivable source, construct,
      checkpoint-specific exposure, rights, A1 split/leakage, power >= 0.80,
      and full CI width <= 0.30 gate passes, despite a single GSM, no biological
      replicate, and paper biological SE=null. Its qualified scope is limited to
      within-assay development/optimization; confirmatory and generalization
      contributions remain zero, and technical uncertainty is restricted to QC
      and within-assay technical diagnostics and cannot support biological SE,
      power, CI, equivalence, confirmatory, or generalization claims. Candidate
      Hamming distances 1, 2, and 3 remain eligible; contract primary budget
      reporting for this study uses K in {1,3}; the global primary list
      [1,3,5] remains unchanged; and K5 is claim-boundary-only with no
      qualification credit. If qualified, GSE114002 is one study and can
      contribute at most ordinary=1, A1=0, true-A2=1; GSMs, libraries, pools,
      and candidates cannot be split into additional studies. For GSE200304,
      the author-published processed
      endpoint becomes the conditional A1 primary measurement route and raw
      replay becomes reproducibility auxiliary, while row-level multi-asset
      lineage, endpoint direction/scale/semantics, biological group,
      replicate-or-valid-SE, rights, checkpoint-specific exposure, A1
      split/leakage, power >= 0.80, and full CI width <= 0.30 remain
      nonwaivable. If qualified, GSE200304 is one superseries study and can
      contribute at most ordinary=1, A1=1, true-A2=0; subseries, modalities,
      endpoints, and replicates cannot be counted as separate studies. A1
      freezes source authority, biological groups,
      near-duplicate graph, and split salt and must pass zero-leakage audit; A2
      freezes final benchmark membership. Checkpoint-specific exposure and
      license/redistribution rights cannot be waived. Both uncertainty routes are
      dataset-scoped and create no global replicate/SE relaxation; in particular,
      the GSE149487 three-biological-replicate and Route-A SE gate and every
      other dataset-specific stricter gate remain unchanged. This decision qualifies no
      study, creates no canonical record, authorizes no training/model selection,
      and establishes no scientific claim.
    status: FROZEN_USER_AUTHORIZED_A1_QUALIFICATION_POLICY
