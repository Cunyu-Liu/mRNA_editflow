task_split_semantics:
  T5_SOURCE_RELATIVE_EFFECT:
    confirmatory_rule: NEW_ORDINARY_CONFIRMATORY_SET_OR_STRICT_NESTED_GROUP_CV
    per_study_then_equal_study_macro: true
  T5_SELECTIVE_EFFECT:
    confirmatory_rule: SAME_FROZEN_PARTITIONS_AS_EFFECT_TASK
    calibration_partition: ORDINARY_DEVELOPMENT_ONLY
  T5_MEASURED_NEIGHBORHOOD_OPTIMIZATION:
    minimum_distinct_candidates_for_ndcg: 3
    pairwise_only_when_distinct_candidates: 2
  T5_FIXED_BUDGET_MULTI_STEP_OPTIMIZATION:
    primary_edit_budgets: [1, 3, 5]
    secondary_edit_budgets: [10]
    measured_multi_edit_support_required_for_biological_claim: true
  FLOW_BASE_LEGAL_CTMC:
    legal_action_space_shared_across_comparators: true
  EXACT_GUIDANCE_TOY_GRAPH:
    biological_claim_support_allowed: false
  EXACT_GUIDANCE_MATCHED_COMPUTE:
    guide_evaluator_separation_required: true
    compute_ledger_required: true
  TRANSFER_3UTR:
    priority: FIRST_SECONDARY_REGION
    comparison: [GENERIC_SHARED_MODEL, REGION_FROM_SCRATCH_BASELINE]
  TRANSFER_CDS:
    priority: PARALLEL_QUALIFICATION
    comparison: [CODON_HEURISTICS, EXTERNAL_CDS_METHODS, REGION_FROM_SCRATCH_BASELINE]
  SEALED_EXTERNAL_ADJUDICATION:
    execution_enabled: false
    execution_authorized: false
    access_intent_allowed: false
    required_authorization_phase: A10
    required_user_authorization: true
    final_evaluator_count_max: 1
    output:
      aggregate_only: true
      row_level_labels_returned: false

sealed_controls:
  sealed_split_id: S6
  sealed_dataset_id: GSE246381
  ordinary_loader_returns_zero_rows: true
  in_ordinary_task_activation: false
  in_metric_branch: false
  in_calibration: false
  in_model_selection: false
  in_architecture_selection: false
  in_threshold_selection: false
