    - ARTIFACT_HASH
    - ANALYSIS_INTENT
    - DENOMINATOR
    - EVIDENCE_STATUS
  empty_evidence_cells_imply_not_established: true
  l4_claim_is_permanently_prohibited_in_v3: true

