    allowed_claims:
      - "observational full-length mRNA pretraining for foundation model (retrospective, E2, used as D_A)"
      - "full-length sequence representation learning (internal, E1)"
    forbidden_claims:
      - "full-length mRNA edit-effect benchmark (FORBIDDEN by v2 §4.2 — full-length out of scope)"
      - "full-length mRNA joint optimization (FORBIDDEN — out of scope)"
      - "cross-region full-transcript synergy (FORBIDDEN by v2 §4.2 — out of scope)"
      - "promoted to primary benchmark by construct quality (FORBIDDEN — scope overrides quality)"
      - "generated full-length candidates improve therapeutic mRNA efficacy (E6 not in scope + full-length out of scope)"
    size_note: "233 full-length constructs — small dataset; explicitly NOT promoted to D_C or D_D. Full-length is out of scope (v2 §4.2), so the dataset is capped at D_A regardless of construct count or data quality."

