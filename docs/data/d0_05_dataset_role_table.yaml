    paper: "iCodon synonymous CDS library MPRA (mRNA decay at 2h/5h/8h)"
    region: CDS
    endpoint: mrna_decay_2h_5h_8h
    variant_count: "1395 synthesized synonymous CDS (955 perfect; 100 proteins x 16 designs)"
    v2_role: D_A
    v2_role_definition: "unlabeled/observational corpus — foundation representation only. CDS region is OUT OF SCOPE for v2 primary benchmark (v2 §4.2)."
    v2_evidence_grade: E2
    v2_evidence_grade_definition: "retrospective measured (public MPRA data, used as observational pretraining only)"
    v1_role: codon_benchmark
    v1_grade: B1
    role_change_reason: "v2 contract §4.2: CDS synonymous generation is OUT OF SCOPE. Downgraded from 'codon_benchmark' (v1 B1) to D_A (observational pretraining only). The data is still downloaded and may be used for foundation model pretraining, but it CANNOT serve as a v2 primary benchmark component, cannot validate CDS edit-effect claims, and cannot be promoted by its variant count."
    allowed_claims:
      - "observational CDS pretraining for foundation model (retrospective, E2, used as D_A)"
      - "codon-level sequence representation learning (internal, E1)"
    forbidden_claims:
      - "CDS synonymous edit-effect benchmark (FORBIDDEN by v2 §4.2 — CDS out of scope)"
      - "CDS grammar validation (FORBIDDEN — out of scope)"
      - "CDS edit-trajectory generation (FORBIDDEN — out of scope)"
      - "promoted to primary benchmark by variant count (FORBIDDEN — size does not override scope)"
      - "generated CDS candidates improve therapeutic mRNA efficacy (E6 not in scope + CDS out of scope)"
    size_note: "1395 synonymous CDS — moderate size; explicitly NOT promoted to D_C or D_D by size. CDS is out of scope (v2 §4.2), so the dataset is capped at D_A regardless of variant count or data quality."

  # =====================================================================
  # 9. PERSIST-seq — GSE173083 (full-length) — OUT OF SCOPE, DOWNGRADED
  # =====================================================================
  - candidate_id: editbench_cds_persistseq
    accession: GSE173083
    paper: "PERSIST-seq full-length mRNA MPRA (ribosome load / in-cell stability / in-solution stability)"
    region: full_length
    endpoint: "ribosome_load; in_cell_stability; in_solution_stability"
    variant_count: "233 full-length mRNA constructs (24 CDS designs)"
    v2_role: D_A
