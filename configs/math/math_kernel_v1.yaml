schema_version: math_kernel_v1
kernel_id: mk0-v1
phase: MK0
evidence_level: E0_MATH_ENGINEERING_ONLY
contract:
  path: "mrna 最新构建合同-先做.md"
  sha256: "3a3a654ca5c10a988eca897bff40be2e0b45c841f744f7423fdfd60b298b5791"
  section: "31A"
  rule: "FM0_PASS_before_MK0; MK0_PASS_before_EF0_or_formal_GP0"
scope:
  performance_claims_allowed: false
  biological_trajectory_claims_allowed: false
  exact_gillespie_claims_allowed: false
  final_label_access_allowed: false
  primary_loss: "L_EF + alpha_stop * L_stop"
  alpha_stop: 1.0
  alpha_cond: 0.0
  alpha_reg: 0.0

provenance:
  original_paper:
    title: "Edit Flows: Variable Length Discrete Flow Matching with Sequence-Level Edit Operations"
    arxiv_id: "2506.09018"
    frozen_version: "v3"
    publication: "NeurIPS 2025"
    url: "https://arxiv.org/abs/2506.09018v3"
  original_implementation:
    public_status: NOT_VERIFIED_PUBLIC
    revision: NOT_VERIFIED_PUBLIC
    commit_sha256: NOT_VERIFIED_PUBLIC
    rule: "Do not substitute a third-party or project-local revision for an official implementation hash."
  project_reference_implementation:
    git_commit: RUNTIME_REQUIRED
    dirty_diff_sha256: RUNTIME_REQUIRED

randomness:
  master_seed: 20260802
  deterministic_replay_required: true
  numpy_seed: 20260802
  torch_seed: 20260802
  cuda_seed: 20260802

alphabet: [A, C, G, U]
time_direction: source_at_0_to_target_at_1

numeric:
  cpu:
    use: [symbolic_derivation, exhaustive_oracle, non_neural_unit_test]
    dtype: float64
    atol: 1.0e-10
    rtol: 1.0e-8
    finite_difference_atol: 1.0e-6
    finite_difference_rtol: 1.0e-5
  gpu:
    neural_forward_backward_required: true
    dtype: float32
    atol: 1.0e-5
    rtol: 1.0e-4
    allow_cpu_fallback: false
    amp_enabled: false
    tf32_enabled: false
  probability:
    atol: 1.0e-12
    rtol: 1.0e-10
  quadrature:
    atol: 1.0e-8
    rtol: 1.0e-7
  exact_discrete:
    atol: 0.0
    rtol: 0.0
  clip_policy:
    rate_clip: null
    weight_clip: null
    silent_clip_allowed: false
    endpoint_clip_only: true
    clip_hit_count_required: true
    nonfinite_policy: FAILED_NUMERICAL

state_action:
  state_schema: schemas/edit_state_v1.schema.json
  action_schema: schemas/edit_action_v1.schema.json
  trajectory_schema: schemas/edit_trajectory_v1.schema.json
  termination_schema: schemas/termination_event_v1.schema.json
  coordinate_system: pre_action_current_state_zero_based
  insertion_coordinate: gap_index_0_through_L
  edit_budget_cost:
    INS: 1
    SUB: 1
    DEL: 1
    STOP: 0
    forced_termination: 0
  reverse_and_cycle_edits_consume_budget: true
  halted_is_absorbing: true

coupling:
  schema: schemas/coupling_manifest_v1.schema.json
  primary: unit_cost_levenshtein_optimal_canonical
  canonical_tie_break: MATCH_then_DEL_then_INS_then_SUB_then_lexicographic_token
  sensitivities:
    - sample_uniform_from_optimal_alignments
    - equivalent_edit_order
  path_is_observed: false
  path_semantics: latent_algorithmic
  joint_path: independent_switch_clock_product
  z_aux_training_only: true
  rate_field_receives_z_aux: false
  illegal_target_action_policy: reject_or_repair_and_ledger

schedule:
  primary:
    name: cubic
    kappa: "t**3"
    derivative: "3*t**2"
    rho: "3*t**2/(1-t**3)"
  sensitivity:
    - name: linear
      kappa: "t"
      derivative: "1"
      rho: "1/(1-t)"
  time_eps: 1.0e-4
  time_eps_sensitivity: [1.0e-3, 1.0e-5]
  training_time_distribution:
    name: uniform
    minimum: 0.0
    maximum: 0.9999
  endpoint:
    evaluate_exactly_at_t1: false
    last_rate_evaluation_time: 0.9999
    singular_nonfinite_policy: FAILED_NUMERICAL

rate_kernel:
  nonnegative_parameterization: softplus
  hard_mask_before_normalization: true
  token_distribution_normalized_over_legal_tokens_only: true
  event_distribution_only_if_total_hazard_positive: true
  zero_instantaneous_hazard: NO_EVENT_ADVANCE_AND_RECOMPUTE
  zero_remaining_integrated_hazard:
    requires_separate_numerical_verification: true
    termination_reason: FORCED_ZERO_REMAINING_INTEGRATED_HAZARD
  transition_level_aggregation_before_log: true
  generator_space: extended_state_Y
  explicit_external_time_argument: true

loss:
  edit_flow:
    level: unique_next_extended_state
    formula_version: mk0_bregman_transition_aggregate_v1
    exact_nll_claim_allowed: false
  stop:
    primary: post_completion_exponential_dwell_survival
    competing_risk_ratio_role: non_ctmc_event_type_ablation_only

stop:
  structural_completion_time: max_independent_edit_switch_clocks
  zero_edit_completion_time: 0.0
  dwell_distribution: exponential
  gamma_ref: 16.0
  gamma_ref_sensitivity: [8.0, 32.0]
  dwell_independent_of_switch_clocks: true
  dwell_independence_audit:
    gamma_values: [8.0, 16.0, 32.0]
    samples_per_gamma: 8192
    oracle: shared_uniform_across_multiple_completion_clock_sets
    completion_clock_variants: 3
    bitwise_dwell_equality_required: true
    analytic_inverse_transform: "-log1p(-max(u,nextafter(0,1)))/gamma"
    analytic_atol: 1.0e-8
    analytic_rtol: 1.0e-7
    empirical_pearson_role: diagnostic_only_not_gate
    claim_boundary: structural_rng_independence_oracle_plus_empirical_diagnostic
  administrative_horizon: 1.0
  event_uses_predictable_pre_event_state: true
  quadrature:
    method: gauss_legendre
    nodes: 64
    reference_nodes: 128
  termination_reasons:
    - LEARNED_STOP
    - FORCED_BUDGET
    - FORCED_NO_LEGAL_EDIT_ACTION
    - FORCED_ZERO_REMAINING_INTEGRATED_HAZARD
    - FORCED_TIME_HORIZON
    - FAILED_NUMERICAL
  step0_identity_output_allowed: false

samplers:
  paper_reference:
    name: paper_first_order_parallel
    role: numerical_reference_only
    semantics: fixed_grid_parallel_first_order_approximation
    exact_gillespie: false
    posthoc_projection_or_repair_allowed: false
    collision_order: DEL_descending_index_then_SUB_ascending_index_then_INS_ascending_gap_token
    joint_event_legality_required_for_utr_use: true
  primary:
    name: constrained_single_event_first_order
    role: hard_constrained_utr_primary
    semantics: endpoint_single_event_frozen_rate_approximation
    exact_gillespie: false
    step_sizes: [0.03125, 0.015625, 0.0078125, 0.00390625]
    primary_step_size: 0.0078125
    adaptive_max_hazard_product: 0.05
    max_events_per_substep: 1
    event_probability: "-expm1(-h*total_hazard)"
    recompute_state_mask_and_rates_after_every_edit: true
  convergence:
    trajectories_per_step_size: 512
    finest_pair_total_variation_atol: 0.03
    finest_pair_mean_edit_count_atol: 0.05
    finest_pair_termination_fraction_atol: 0.03
    require_error_nonincrease_against_integrated_hazard_reference: true

foundation:
  source_embedding_cache_allowed: true
  current_embedding_recomputed_after_each_edit: true
  incremental_update_enabled: false
  incremental_requires_layerwise_equivalence_before_enable: true
  frozen_foundation_first: true
  required_rate_inputs:
    - current_token_and_gap_representation
    - source_aligned_representation_from_M_run
    - source_current_inference_visible_features
    - region_adapter
    - assay_context_endpoint
    - target_condition
    - time_embedding
    - remaining_budget
    - edit_history_summary
  prohibited_rate_inputs:
    - Z_aux
    - target_sequence
    - target_alignment
    - remaining_target_edits
  gpu_smoke:
    force_actions: [INS, SUB, DEL, STOP]
    require_nonzero_oracle_rates: true
    require_backward: true
    require_cuda_tensor_and_memory_evidence: true

critic_boundary:
  base_sampler_requires_critic: false
  critic_may_change_hard_legality: false
  final_evaluator_guidance_allowed: false
  guidance_query_log: append_only
  future_routes: [classifier_free_condition, frozen_critic_guidance, post_generation_reranking]
  final_route_selection_policy: development_once_then_freeze

validation_domains:
  tiny_state_exhaustive:
    alphabet: [A, C]
    sequence_lengths: [1, 2, 3]
    sequence_count: 14
    source_current_pair_count: 196
    budgets: [0, 1, 2]
    run_states: [ACTIVE, HALTED]
    state_count: 1176
  alignment_exhaustive:
    alphabet: [A, C]
    sequence_lengths: [1, 2, 3]
    ordered_pair_count: 196
  repeated_symbol_oracle:
    cases: ["AA_to_A", "A_to_AA", "AAA_to_AA", "AA_to_AAA", "ACA_to_AAC"]
  real_length_property_tests:
