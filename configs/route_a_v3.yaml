verification_policy:
  targeted_validation_by_artifact:
    document_or_config: [SCHEMA, AUTHORITY_UNIQUENESS, CROSS_REFERENCE, CONFLICT_MARKER, GIT_DIFF_CHECK]
    data: [PAPER_COUNTS, RAW_TO_CANONICAL_LINEAGE, SOURCE_CANDIDATE_DIFF, ENDPOINT_DIRECTION, GROUP_IDENTITY, LEAKAGE, LICENSE, REJECTED_TABLE]
    critic: [SWAP_ANTISYMMETRY, IDENTITY_ZERO, PADDING_INVARIANCE, EDIT_AFTER_100, UNKNOWN_CONTEXT, TARGET_SEMANTICS, CANDIDATE_PERMUTATION, ANCHOR_ONLY, DETERMINISTIC_PREDICTIONS]
    flow: [LEGAL_ACTIONS, BUDGET, STOP, TRANSITION_ALIAS, SUPPORT, PATH_CONSISTENCY, TOY_EXACT_DISTRIBUTION, TRAJECTORY_REPLAY]
    evaluator: [GUIDE_EVALUATOR_CHECKPOINT_DATA_EXPOSURE_AND_ARCHITECTURE_SEPARATION, SEALED_IMPORT_FORBIDDEN]
    operations: [CUDA_FAIL_CLOSED, OCCUPIED_GPU_REFUSAL, RESUME_BINDING, MANIFEST_COMPLETENESS, LARGE_FILE_SECRET_RESTRICTED_SCAN, PUSH_VERIFICATION]
  full_validation_milestones: [A2, A4, A7, A9, A10]
  repeat_identical_validation_on_unchanged_code: false

gpu_policy:
  formal_parameter_updates_require_cuda: true
  parameter_updating_run_types:
    - NEURAL_CRITIC
    - BASE_FLOW
    - GUIDANCE_OR_VALUE_NETWORK
    - FOUNDATION_FINE_TUNE
  cuda_unavailable_behavior: FAIL_CLOSED
  silent_cpu_fallback_allowed: false
  launch_record_required:
    - GPU_UUID
    - GPU_MODEL
    - DRIVER
    - CUDA_VERSION
    - PYTORCH_VERSION
    - DEVICE
    - PEAK_VRAM
  prelaunch_checks: [PID, OWNER, VRAM, UTILIZATION]
  low_vram_implies_authorization_to_use_gpu: false
  unrelated_process_preemption_allowed: false
  cpu_allowed_for:
    - DATA_PROCESSING
    - STATISTICS
    - HASHING
    - GIT
    - SMALL_GRAPH_EXACT_ENUMERATION
    - INDEPENDENT_NUMERICAL_CHECKER
    - ORDINARY_UNIT_TESTS
  parameter_updating_toy_network_requires_gpu: true
  monitoring_cadence:
    startup_and_first_batch_sanity: true
    first_checkpoint_or_minutes: "10-15"
    stable_max_frequency_minutes: 30
    event_driven_checks:
      - CHECKPOINT
      - VALIDATION
      - OOM
      - NAN
      - PROCESS_EXIT
      - COMPLETION
    report_unchanged_state_repeatedly: false
  failure_handling:
    preserve_failure_bundle: true
    preserve_last_valid_checkpoint: true
    new_run_id_required_if_changed:
      - BATCH_SIZE
      - PRECISION
      - OPTIMIZER
      - EFFECTIVE_BATCH_SIZE
      - DATA_VERSION

