# ---------------------------------------------------------------------------
# 4. Reward / beta / calibration (frozen)
# ---------------------------------------------------------------------------
reward:
  reward_source: frozen_critic_delta     # delta = cand_pred - MEASURED source
  beta: 1.0
  guidance_strategy_primary: rate_cfg     # the G1-X value axis (generation quality)
  calibration: development_calibrated     # temperature / Platt done pre-freeze
  ood_penalty: pre_registered_margin

# ---------------------------------------------------------------------------
# 5. Primary metric family + Holm correction (frozen)
# ---------------------------------------------------------------------------
metrics:
  holm_family:
    # Family-wise error-rate control across the primary hypotheses.
    # k = number of primary hypotheses; alpha split by Holm-Bonferroni.
    inference: HOLM_BONFERRONI
    alpha: 0.05
    hypotheses:
      - id: H1_EFFECT_TRANSFER
        metric: macro_delta_spearman
        benchmark: 5U-A1
        sealed_split: S6
        direction: higher_is_better
        null_hypothesis: "critic anchored delta has no monotone association with measured delta on sealed external"
      - id: H2_GUIDANCE_VALUE
        metric: generation_quality_mean_delta
        strategy: rate_cfg
        vs: no_guidance
        direction: higher_is_better
        null_hypothesis: "rate_cfg generation-quality mean_delta <= no_guidance on sealed external"
      - id: H3_LEGALITY
        metric: legality_rate
        benchmark: 5U-A1
        direction: higher_is_better
        null_hypothesis: "guidance violates the legal edit graph on sealed external"
    primary_metric_axes:
      - macro_delta_spearman
      - macro_sign_accuracy
      - top10_enrichment
      - ndcg_at_k
      - normalized_regret
      - generation_quality_mean_delta
      - generation_quality_frac_beneficial
      - legality_rate

# ---------------------------------------------------------------------------
# 6. GO / NO-GO thresholds (pre-registered, carried forward from G1-X)
# ---------------------------------------------------------------------------
go_nogo:
  # Effect translation / generalization to the sealed external (L1/L2).
  effect_gate:
    macro_delta_spearman_ge: 0.25
    macro_sign_accuracy_ge: 0.60
    top10_enrichment_ge: 1.50
    beat_strongest_nonfoundation_baseline: true   # beat abs_candidate on same sealed folds
  # Guidance value axis (the G1-X generation-quality demonstration, carried forward).
  guidance_gate:
    primary_strategy: rate_cfg
    vs: no_guidance
    generation_quality_mean_delta_gt: 0.0        # rate_cfg > no_guidance in mean_delta
    generation_quality_frac_beneficial_gt: 0.0   # rate_cfg > no_guidance in frac_beneficial
    ndcg_gap_ge: 0.05                            # NDCG >= strongest matched baseline + 0.05
    top10_recall_ge: 0.70
    normalized_regret_le: 0.10
  hard_constraints:
    legality_ge: 1.00
    length_preservation_ge: 1.00
    budget_violation_le: 0.0
  ood_margin:
    degradation_margin: preregistered
    fail_if_beyond: true

# ---------------------------------------------------------------------------
# 7. Seeds / failed-seed handling / evaluator / budget / output schema
# ---------------------------------------------------------------------------
execution:
  seed: 42
  failed_seed_handling:
    - "failed seed is recorded and excluded; best-seed reporting is prohibited"
    - "no seed is retried after a sealed final abort"
  evaluator_command: "python -m scripts.e0x.run_e0x_final --dataset artifacts/b0x/effect_dataset.jsonl --prereg configs/e0x_preregistration_v1.yaml --restricted /home/cunyuliu/mrna_editflow_goal/restricted/v3_1_data_bench_closure_20260803/sealed_external/GSE246381 --gpu cuda:3"
  container_or_env: editflow
  gpu_policy:
    permitted: [cuda:1, cuda:2, cuda:3]
    forbidden: [cuda:4, "4"]
    fallback: ""            # fail-closed if CUDA unavailable (no silent CPU)
  budget:
    candidate_budget: fixed_measured_pool
    query_budget: fixed_measured_pool
    forward_equivalents: recorded_per_strategy
    wall_time: recorded_per_strategy
  output_schema:
    artifact: artifacts/e0x/e0x_final_results.json
    schema_version: "1.0"
    aggregate_only: true
    row_level_labels_returned: false
    fields:
      - phase
      - preregistration_id
      - status
      - sealed_access_state
      - per_hypothesis
      - holm_adjusted_pvalues
      - go_nogo_verdict

# ---------------------------------------------------------------------------
# 8. Fallback route (frozen)
# ---------------------------------------------------------------------------
fallback:
  - "data + critic + guidance all pass -> mRNA-XEditFlow main paper"
  - "data + critic pass but Flow/guidance fails -> mRNA-EditBench + SparseEditFormer main paper"
  - "critic only valid on random split -> stop generation line; return to data/pair/endpoint/leakage repair"